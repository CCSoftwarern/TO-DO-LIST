{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="descricao">Descrição</label>
    <textarea name="descricao" id="descricao">{{ request.form['descricao'] or tarefa['descricao'] }}</textarea>
    <label for="status">Status</label>
    <input name="status" id="status" value="{{ request.form['status'] or tarefa['status']}}" required>
    <input type="submit" value="Save">
  </form>
    <form action="{{ url_for('lista.deleteTarefa', idlista=tarefa['ListaID'], id=tarefa['id']) }}" method="post">
    <input class="danger" type="submit" value="Delete" onclick="return confirm('Are you sure?');">
  </form>
  <hr>

{% endblock %}
