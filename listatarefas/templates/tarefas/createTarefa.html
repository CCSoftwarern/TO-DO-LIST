{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Nova Tarefa{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="descricao">Descrição</label>
    <textarea name="descricao" id="descricao">{{ request.form['descricao']  }}</textarea>
    <label for="status">Status</label>
    <input name="status" id="status" value="{{ request.form['status'] }}" required>
    <input type="submit" value="Save">
  </form>
{% endblock %}
